spring.application.name=options-exercise-engine

# Exercise threshold: in-the-money intrinsic value must be >= threshold, otherwise abandon (audited)
exercise.engine.exercise-threshold=0
# Batch processing
exercise.engine.batch-size=100
exercise.engine.concurrency=4
exercise.engine.operation-timeout-ms=0
# Assignment: proportional | random (random uses the fixed seed below)
exercise.engine.assignment-strategy=proportional
exercise.engine.random-seed=20260101
# Manual intervention window after a run starts; 0 means unrestricted
exercise.engine.intervention-window-ms=0
# Durable state directory (WAL transactions + audit log)
exercise.engine.state-dir=target/engine-state
